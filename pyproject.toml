
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "darts-autoscorer"
version = "0.1.0"
description = "Computer vision tools for automatic darts scoring"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python",
]

[tool.setuptools.packages.find]
where = ["src"]

